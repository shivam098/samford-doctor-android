name: Tablet emulator tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_SHA: 83be4ae028d9f995cd96cbdf00b430ea61bc3795

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Start isolated mock backend (reachable from the emulator at 10.0.2.2:4320)
        run: |
          git clone --quiet https://github.com/shivam098/samford-web-app.git "$RUNNER_TEMP/backend"
          cd "$RUNNER_TEMP/backend"
          git checkout --quiet "$BACKEND_SHA"
          npm ci --no-audit --no-fund
          nohup npm run mobile:isolated -- --port 4320 --data "$RUNNER_TEMP/samford-db" --reset --relaxed-limits --test-support > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4320/api/mobile/v1/meta && break; sleep 2; done

      - name: Build app and test APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Instrumented tests on a Pixel Tablet AVD (offline, then online)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p artifacts
            adb shell "nohup screenrecord --time-limit 175 /sdcard/offline.mp4 > /dev/null 2>&1 &"
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || echo "offline run failed" > artifacts/offline.failed
            cp -r app/build/outputs/androidTest-results artifacts/offline-test-results || true
            sleep 3; adb pull /sdcard/offline.mp4 artifacts/offline.mp4 || true
            adb pull /sdcard/Android/data/com.samford.doctor.debug/files/screens artifacts/offline-screens || true
            adb uninstall com.samford.doctor.debug || true
            adb shell "nohup screenrecord --time-limit 175 /sdcard/online.mp4 > /dev/null 2>&1 &"
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.samfordApiBase=http://10.0.2.2:4320/api/mobile/v1 -Pandroid.testInstrumentationRunnerArguments.class=com.samford.doctor.DeviceFlowTest || echo "online run failed" > artifacts/online.failed
            sleep 3; adb pull /sdcard/online.mp4 artifacts/online.mp4 || true
            adb pull /sdcard/Android/data/com.samford.doctor.debug/files/screens artifacts/online-screens || true
            test ! -f artifacts/offline.failed && test ! -f artifacts/online.failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: |
            artifacts/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            ${{ runner.temp }}/backend.log
