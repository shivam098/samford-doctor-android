name: Tablet emulator tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_SHA: dffde174d2db74c42dae79e3de20b5f0cd58ba0f

jobs:
  instrumented:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Shipping behaviour: the app picks the wet-ink path from the GPU's capabilities (software
          # GPUs get the standard path). Run 44871826624 forced the low-latency path on SwiftShader
          # GL/Vulkan (API 34/35) and reproduced libhwui crashes and a renderer hang; the standard
          # path ran crash-free.
          - { name: "API 34 tablet, auto ink path", api: 34, gpu: swiftshader_indirect, wetInk: auto }
          - { name: "API 35 tablet, auto ink path", api: 35, gpu: swiftshader_indirect, wetInk: auto }
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Start isolated mock backend (reachable from the emulator at 10.0.2.2:4320)
        run: |
          git clone --quiet https://github.com/shivam098/samford-web-app.git "$RUNNER_TEMP/backend"
          cd "$RUNNER_TEMP/backend"
          git checkout --quiet "$BACKEND_SHA"
          npm ci --no-audit --no-fund
          nohup npm run mobile:isolated -- --port 4320 --data "$RUNNER_TEMP/samford-db" --reset --relaxed-limits --test-support > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4320/api/mobile/v1/meta && break; sleep 2; done

      - name: Build app and test APKs, plus the R8 release signed with the debug key for a smoke run
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out release-smoke.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Instrumented tests on a Pixel Tablet AVD (offline, then online)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p artifacts
            bash scripts/ci/release-smoke.sh release-smoke.apk artifacts || echo "release smoke: script exited non-zero" >> artifacts/release.failed
            adb shell "nohup screenrecord --time-limit 175 /sdcard/offline.mp4 > /dev/null 2>&1 &"
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.samfordWetInk=${{ matrix.wetInk }} || echo "offline run failed" >> artifacts/offline.failed
            cp -r app/build/outputs/androidTest-results artifacts/offline-test-results || true
            grep -rl "Fatal signal" artifacts/offline-test-results > artifacts/offline-native-crashes.txt || true
            sleep 3; adb pull /sdcard/offline.mp4 artifacts/offline.mp4 || true
            adb pull /sdcard/Android/data/com.samford.doctor.debug/files/screens artifacts/offline-screens || true
            adb uninstall com.samford.doctor.debug || true
            adb shell "nohup screenrecord --time-limit 175 /sdcard/online.mp4 > /dev/null 2>&1 &"
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.samfordApiBase=http://10.0.2.2:4320/api/mobile/v1 -Pandroid.testInstrumentationRunnerArguments.samfordWetInk=${{ matrix.wetInk }} -Pandroid.testInstrumentationRunnerArguments.class=com.samford.doctor.DeviceFlowTest || echo "online run failed" >> artifacts/online.failed
            grep -rl "Fatal signal" app/build/outputs/androidTest-results > artifacts/online-native-crashes.txt || true
            sleep 3; adb pull /sdcard/online.mp4 artifacts/online.mp4 || true
            adb pull /sdcard/Android/data/com.samford.doctor.debug/files/screens artifacts/online-screens || true
            cat artifacts/*.failed 2>/dev/null || true
            test ! -f artifacts/release.failed && test ! -f artifacts/offline.failed && test ! -f artifacts/online.failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api${{ matrix.api }}-${{ matrix.gpu }}-${{ matrix.wetInk }}
          path: |
            artifacts/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            ${{ runner.temp }}/backend.log